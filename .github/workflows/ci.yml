name: Cross-platform CI

on:
  push:
    branches: [main, codex/windows-support]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm run verify:npm
      - run: npm ci
      - run: npm run ci:verify
      - run: npm run audit:security
      - run: npm run pack:win
      - run: npm run verify:win-package
      - run: npm run test:ui:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Workboard-Windows-x64
          path: dist/win-unpacked/**
          if-no-files-found: error

  macos-test-and-package:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm run verify:npm
      - run: npm ci
      - run: npm run ci:verify
      - run: npm run audit:security
      - run: npm run pack:mac
      - run: npm run test:ui:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Workboard-macOS-${{ runner.arch }}
          path: dist/mac*/Codex Workboard.app/**
          if-no-files-found: error
