name: Bug 报告
description: 报告可复现的功能问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿附带真实对话内容、访问令牌、数据库或个人绝对路径。
  - type: input
    id: version
    attributes:
      label: Workboard 版本
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 与芯片
      placeholder: macOS 15 / Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除真实对话、账号、令牌和个人路径
          required: true
