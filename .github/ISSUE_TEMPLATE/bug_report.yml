name: Bug 报告
description: 报告可复现的功能问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿附带真实对话内容、访问令牌、数据库或个人绝对路径。
  - type: input
    id: version
    attributes:
      label: Workboard 版本
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - Windows x64
        - macOS Apple Silicon
        - macOS Intel
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: 系统版本与构建类型
      placeholder: Windows 11 24H2 / 未签名目录包
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除真实对话、账号、令牌和个人路径
          required: true
